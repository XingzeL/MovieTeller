name: Server jobs tests

on:
  push:
    paths:
      - "server/**"
      - "docs/**"
      - ".github/workflows/server-jobs.yml"
  pull_request:
    paths:
      - "server/**"
      - "docs/**"
      - ".github/workflows/server-jobs.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: jobs.test.js
        run: node --test --test-force-exit test/jobs.test.js
      - name: retention.scan.test.js
        run: node --test --test-force-exit test/retention.scan.test.js
      - name: auth.session.test.js
        run: node --test --test-force-exit test/auth.session.test.js
      - name: auth.clerk.test.js
        run: node --test --test-force-exit test/auth.clerk.test.js
      - name: jobs.acl.test.js
        run: node --test --test-force-exit test/jobs.acl.test.js
      - name: job.video-purge.test.js
        run: node --test --test-force-exit test/job.video-purge.test.js
      - name: worker.mode.test.js
        run: node --test --test-force-exit test/worker.mode.test.js
      - name: claimJob.test.js
        run: node --test --test-force-exit test/claimJob.test.js

  phase2-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: movieteller
          POSTGRES_PASSWORD: movieteller
          POSTGRES_DB: movieteller
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movieteller -d movieteller"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://movieteller:movieteller@localhost:5432/movieteller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: db migrate
        run: npm run db:migrate
      - name: phase2-lite.db.test.js
        run: npm run test:db

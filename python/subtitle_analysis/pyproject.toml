[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle_analysis"
version = "0.1.0"
description = "Analyze SRT subtitle coverage and derive narration candidate gaps for MovieTeller"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pipeline_types", "subtitle_extraction"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

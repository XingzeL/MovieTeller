[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "narration_video"
version = "0.1.0"
description = "Embed MovieTeller narration audio segments back into source video"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["media_utils", "pipeline_types"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
narration_video = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model_gateway"
version = "0.1.0"
description = "Unified model request gateway for MovieTeller"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dashscope>=1.23.1",
    "movieteller_config",
    "movieteller_logging",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../movieteller_config/src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "movieteller-config"
version = "0.1.0"
description = "Shared configuration loader for MovieTeller (env + YAML merge)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
movieteller_config = ["config/*.yaml"]

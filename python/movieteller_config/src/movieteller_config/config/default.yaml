# See movieteller_config README and repository root .env.example.
# api_keys / api_providers: arbitrary provider slugs. Env supports PREFIX_API_KEY,
# PREFIX_BASE_URL, API_KEYS_JSON, API_PROVIDERS_JSON.
# Configure provider slugs through api_keys and api_providers.

max_frames_per_segment: 32
narration_frame_max_edge: 512
ffmpeg_path: ffmpeg
default_prompt_style: documentary

gateway_default_provider: newapi
api_providers: {}
model_catalog: []
model_defaults: {}

frame_pool_manifest: null
pool_frames_per_shot_min: 1
pool_frames_per_shot_max: 3
pool_frames_per_shot_rate: null
pool_miss_uniform_max_frames: 4
dialogue_overlap_threshold: 0.05
pyscenedetect_merge_sec: 0.25

subtitle_context_chunk_cue_count: 5
subtitle_context_chunk_stride: 3
subtitle_context_history_window_sec: 600
subtitle_context_top_k: 6
subtitle_context_summary_enabled: false

videocaptioner_bin: null
videocaptioner_asr: bijian
videocaptioner_language: auto
videocaptioner_transcribe_timeout_ms: null

narration_polish_enabled: false
narration_tts_enabled: false
narration_polish_target_wpm: 150
narration_polish_cefr_level: B1
narration_polish_strength: medium
narration_polish_safety_margin_sec: 0.2

tts_default_voice: en-US-EmmaMultilingualNeural
tts_default_rate: +0%
tts_default_volume: +0%
tts_default_pitch: +0Hz
tts_default_boundary: SentenceBoundary

video_default_background_audio_volume: 0.35
video_default_speech_audio_volume: 1.0
narration_video_background_audio_volume: 0.35
narration_video_speech_audio_volume: 1.0

workflow_parallelism:
  segment_group_size: 4
  segment_group_concurrency: 8

capability_concurrency:
  narration: 8
  polish: 8
  study_enrichment: 8
  tts: 8
  subtitle_context: 8

# Per-capability HTTP timeouts (seconds) and retry attempt counts (gateway).
capability_timeouts:
  narration: 120
  polish: 120
  tts: 180
  embedding: 60
  chat: 120
capability_retries:
  narration: 2
  polish: 2
  tts: 2
  embedding: 2
  chat: 2

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle_context"
version = "0.1.0"
description = "Subtitle semantic context index and historical retrieval for MovieTeller"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "movieteller_config",
    "subtitle_extraction",
    "rerank",
    "numpy",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

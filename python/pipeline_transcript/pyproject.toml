[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline_transcript"
version = "0.1.0"
description = "Convert MovieTeller pipeline speech_video JSON into a human-readable script"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pipeline-transcript = "pipeline_transcript.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

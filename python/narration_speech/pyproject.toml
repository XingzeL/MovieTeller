[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "narration_speech"
version = "0.1.0"
description = "Generate TTS audio for polished MovieTeller narration with edge-tts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "edge-tts>=7.2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
narration_speech = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

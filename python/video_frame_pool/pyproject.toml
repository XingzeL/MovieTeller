[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "video_frame_pool"
version = "0.1.0"
description = "Stage-1 frame-pool preprocessing and query for MovieTeller"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "media_utils",
    "movieteller_config",
    "pipeline_types",
    "subtitle_extraction",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

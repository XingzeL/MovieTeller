# MovieTeller standalone site config.
# Copy or symlink this file into your Nginx per-site include directory, for example:
#   /opt/homebrew/etc/nginx/servers/movieteller.conf
#
# Prerequisites:
#   cd client && npm run build
#   cd server && PORT=3001 DATABASE_URL=... npm run start:api
#   cd server && DATABASE_URL=... npm run start:worker
#
# Local HTTPS certificate example:
#   brew install mkcert nss
#   mkcert -install
#   mkdir -p /opt/homebrew/etc/nginx/certs
#   mkcert -cert-file /opt/homebrew/etc/nginx/certs/movieteller-local.pem \
#          -key-file /opt/homebrew/etc/nginx/certs/movieteller-local-key.pem \
#          localhost 127.0.0.1 ::1

upstream movieteller_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 8081;
    server_name localhost;

    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    root /Users/zhuanz0000/WorkSpace/MovieTeller/client/dist;
    index index.html;

    client_max_body_size 500m;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/movieteller-local.pem;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/movieteller-local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MovieTellerSSL:10m;
    ssl_session_timeout 1d;

    access_log /opt/homebrew/var/log/nginx/movieteller.access.log;
    error_log  /opt/homebrew/var/log/nginx/movieteller.error.log warn;

    location = /health {
        proxy_pass http://movieteller_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://movieteller_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
